name: User Microservice CI

on:
  push:
    branches: ["Main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: users-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and generate JaCoCo reports
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: users-test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14

      # Activate after configuring the SonarQube Cloud project and repository secrets.
      # Only the default branch is analyzed; PRs and other branches still run tests.
      - name: Analyze with SonarQube Cloud and check Quality Gate
        if: >-
          vars.SONAR_ENABLED == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
        shell: bash
        run: |
          for variable in SONAR_TOKEN SONAR_PROJECT_KEY SONAR_ORGANIZATION; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing configuration: $variable"
              exit 1
            fi
          done
          SONAR_EXTRA_ARGS=""
          if [[ "$SONAR_REGION" == "us" ]]; then
            SONAR_EXTRA_ARGS="-Dsonar.region=us"
          fi

          bash ./mvnw --batch-mode --no-transfer-progress sonar:sonar \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            "-Dsonar.organization=$SONAR_ORGANIZATION" \
            $SONAR_EXTRA_ARGS \
            -Dsonar.qualitygate.wait=true
